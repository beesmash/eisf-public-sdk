name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: typescript
        run: npm install
      - working-directory: typescript
        run: npm test
      - working-directory: typescript
        run: npm pack

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* typescript/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME"               dist/*               typescript/*.tgz               --title "EISf Public SDK $GITHUB_REF_NAME"               --generate-notes
          fi
