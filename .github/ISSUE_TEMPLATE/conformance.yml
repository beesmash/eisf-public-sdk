name: Conformance report
description: Report EISf Core compatibility results
title: "[Conformance] "
body:
  - type: input
    id: implementation
    attributes:
      label: Implementation and version
    validations:
      required: true
  - type: input
    id: suite
    attributes:
      label: Conformance suite version
      value: "0.1"
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results / CI link
    validations:
      required: true
