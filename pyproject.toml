[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eisf-public-sdk"
version = "0.1.0"
description = "Provider-neutral SDK for the EISf public reasoning canon."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Erick Lester Brown / Beesmash Inc."}]
keywords = ["eisf", "ai", "reasoning", "decision-support", "openai", "ollama"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]
dependencies = []

[project.scripts]
eisf = "eisf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
